<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyUp — FLEXECHARGE Content Intake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --blue: #4A9CF5;
    --purple: #7B6BE6;
    --green: #2DD4A8;
    --flex-green: #22C55E;
    --dark: #0F1923;
    --card: #161F2C;
    --border: rgba(255,255,255,0.08);
    --gray: #8896A6;
    --white: #F1F5F9;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    line-height: 1.6;
  }

  .header {
    padding: 32px 24px 0;
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 20px;
  }
  .logo {
    width: 48px; height: 48px;
    background: linear-gradient(180deg, var(--blue), var(--purple));
    border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 26px; height: 26px; }
  .wordmark {
    height: 22px; width: auto;
    display: inline-block;
  }
  .logo-x {
    font-size: 16px; color: rgba(255,255,255,0.25); font-weight: 500;
  }
  .header h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .header p { color: var(--gray); font-size: 15px; max-width: 480px; margin: 0 auto 8px; }
  .header .time-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(45,212,168,0.1); border: 1px solid rgba(45,212,168,0.25);
    color: var(--green); font-size: 13px; font-weight: 600;
    padding: 6px 16px; border-radius: 50px; margin-top: 12px;
  }

  .progress-wrap {
    max-width: 640px; margin: 28px auto 0; padding: 0 24px;
  }
  .progress-bar {
    height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    border-radius: 4px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .progress-label {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 12px; color: var(--gray); font-weight: 500;
  }

  .container {
    max-width: 640px; margin: 0 auto; padding: 24px 24px 120px;
  }

  .section {
    display: none; animation: fadeIn 0.4s ease;
  }
  .section.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--blue); margin-bottom: 8px;
  }
  .section-title {
    font-size: 22px; font-weight: 700; margin-bottom: 4px;
  }
  .section-desc {
    font-size: 14px; color: var(--gray); margin-bottom: 28px;
  }

  .question {
    margin-bottom: 28px;
  }
  .q-label {
    font-size: 15px; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .q-label .opt {
    font-size: 11px; color: var(--gray); font-weight: 400;
    background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px;
  }
  .q-hint {
    font-size: 13px; color: var(--gray); margin-bottom: 10px;
  }

  textarea, input[type="text"], input[type="url"] {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; color: var(--white);
    font-family: inherit; font-size: 15px; resize: none;
    transition: border-color 0.2s; outline: none;
  }
  textarea:focus, input[type="text"]:focus, input[type="url"]:focus {
    border-color: rgba(74,156,245,0.5);
  }
  textarea { min-height: 80px; }
  textarea.short { min-height: 56px; }

  .inline-text {
    margin-top: 10px; display: none;
  }
  .inline-text.show { display: block; }

  .chips {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    padding: 10px 18px; border-radius: 50px;
    background: var(--card); border: 1px solid var(--border);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.2s; user-select: none;
  }
  .chip:hover { border-color: rgba(74,156,245,0.4); background: rgba(74,156,245,0.08); }
  .chip.selected {
    background: rgba(74,156,245,0.15); border-color: var(--blue); color: var(--blue);
  }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,25,35,0.92); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border); padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
    max-width: 640px; margin: 0 auto;
    z-index: 100;
  }
  @media(min-width:641px) {
    .nav-bar { left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; }
  }
  .btn {
    padding: 12px 28px; border-radius: 12px; font-size: 15px;
    font-weight: 600; cursor: pointer; border: none;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-ghost {
    background: transparent; color: var(--gray);
  }
  .btn-ghost:hover { color: var(--white); }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: white;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-submit {
    background: linear-gradient(135deg, var(--green), #1DB88E);
    color: white;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  .welcome { text-align: center; padding: 40px 0 0; }
  .welcome h2 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  .welcome p { color: var(--gray); font-size: 16px; max-width: 460px; margin: 0 auto 32px; line-height: 1.65; }
  .welcome-cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    text-align: left; margin-bottom: 32px;
  }
  .wc {
    padding: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px;
  }
  .wc h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .wc p { font-size: 12px; color: var(--gray); margin: 0; }

  .done { text-align: center; padding: 60px 0; }
  .done .check {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(45,212,168,0.12); border: 2px solid var(--green);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 20px;
  }
  .done h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .done p { color: var(--gray); font-size: 16px; max-width: 420px; margin: 0 auto; line-height: 1.6; }

  @media(max-width:480px) {
    .welcome-cards { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .section-title { font-size: 20px; }
  }
</style>
</head>

<script>
const sections = [
  // 0: Welcome
  { id: 'welcome', label: 'Welcome', render: () => `
    <div class="welcome">
      <h2>Hey Jan</h2>
      <p>We've already mapped a lot from your 100 LinkedIn posts and your profile. This form fills the gaps that posts alone can't tell us. No need to overthink anything, just answer quickly and honestly.</p>
      <div class="welcome-cards">
        <div class="wc"><h4>5 short sections</h4><p>Mostly tap to answer</p></div>
        <div class="wc"><h4>About 6 minutes</h4><p>Built for busy founders</p></div>
        <div class="wc"><h4>No wrong answers</h4><p>Your real perspective is what we need</p></div>
        <div class="wc"><h4>Stays between us</h4><p>Only shared with your content team</p></div>
      </div>
    </div>
  `},

  // 1: Origin
  { id: 'origin', label: 'Origin', render: () => `
    <div class="section-label">Section 1 of 5</div>
    <div class="section-title">The spark</div>
    <div class="section-desc">Every founder has a story. We want the real one, not the tidy one.</div>

    <div class="question">
      <div class="q-label">What was the moment that made you start FLEXECHARGE?</div>
      <div class="q-hint">A project, a conversation, a realization. Whatever tipped you from "I should do this" to "I'm doing this."</div>
      <textarea data-key="origin_moment" placeholder="e.g. I was running a project at ABENA and kept hitting the same wall with charging infrastructure. One specific conversation with an operator made me realize nobody was solving the actual problem."></textarea>
    </div>
  `},

  // 2: DACH
  { id: 'dach', label: 'DACH', render: () => `
    <div class="section-label">Section 2 of 5</div>
    <div class="section-title">German content</div>
    <div class="section-desc">Your German posts average 31 reactions vs 19 for English, but only 7% of your posts are German. Worth rebalancing?</div>

    <div class="question">
      <div class="q-label">What fits for the next few months?</div>
      <div class="q-hint">Pick any that apply.</div>
      <div class="chips" data-key="dach_direction" data-multi="true">
        <div class="chip">Write more in German</div>
        <div class="chip">Only for DACH-specific topics</div>
        <div class="chip">Keep current English-heavy mix</div>
        <div class="chip">Target a DACH community specifically</div>
        <div class="chip">Mix German and English in the same post</div>
        <div class="chip">Not sure, you decide</div>
      </div>
    </div>
  `},

  // 3: Customers
  { id: 'customers', label: 'Customers', render: () => `
    <div class="section-label">Section 3 of 5</div>
    <div class="section-title">Real projects</div>
    <div class="section-desc">The best posts come from real work. Pick who's fair game, then tell us about one project.</div>

    <div class="question">
      <div class="q-label">Which customers can we reference in posts?</div>
      <div class="q-hint">Only selected names will be named publicly.</div>
      <div class="chips" data-key="customers_ok" data-multi="true" data-reveal="Other">
        <div class="chip">Recharge</div>
        <div class="chip">Q8</div>
        <div class="chip">Electra</div>
        <div class="chip">Other</div>
      </div>
      <div class="inline-text" data-reveal-for="Other">
        <input type="text" data-key="customers_other" placeholder="Which other customers? (comma-separated)">
      </div>
    </div>

    <div class="question">
      <div class="q-label">Pick one project. What changed for them?</div>
      <div class="q-hint">Before vs after, ideally with a number. Can be anonymized if needed.</div>
      <textarea data-key="customer_story" placeholder="e.g. With Recharge, they went from X% uptime to Y% after we deployed Z. Or: one operator cut peak demand charges by 40% in the first quarter."></textarea>
    </div>
  `},

  // 4: Christophe
  { id: 'christophe', label: 'Co-founder', render: () => `
    <div class="section-label">Section 4 of 5</div>
    <div class="section-title">You and Christophe</div>
    <div class="section-desc">You both post from FLEXECHARGE with very different voices. He's brand energy, you're industry insight. We want to know how you see the split.</div>

    <div class="question">
      <div class="q-label">How do you coordinate content with Christophe?</div>
      <div class="chips" data-key="christophe_coord" data-multi="false">
        <div class="chip">We coordinate topics regularly</div>
        <div class="chip">We post independently, no sync</div>
        <div class="chip">We've split lanes (he covers culture, I cover insight)</div>
        <div class="chip">Honestly, we don't really sync</div>
      </div>
    </div>
  `},

  // 5: Untapped
  { id: 'untapped', label: 'Hot takes', render: () => `
    <div class="section-label">Section 5 of 5</div>
    <div class="section-title">What you haven't said yet</div>
    <div class="section-desc">Often the most useful content is what you've been holding back.</div>

    <div class="question">
      <div class="q-label">What strong industry opinion have you not posted yet?</div>
      <div class="q-hint">Doesn't have to be a hot take. Just something you believe that you haven't put out there.</div>
      <textarea data-key="untapped_opinion" placeholder="e.g. Most CPOs are still optimizing for hardware count when they should be optimizing for utilization per site."></textarea>
    </div>

    <div class="question">
      <div class="q-label">What's been holding you back from posting it?</div>
      <div class="chips" data-key="held_back_why" data-multi="false">
        <div class="chip">Too controversial</div>
        <div class="chip">Don't want to upset partners or customers</div>
        <div class="chip">Not sure how to frame it</div>
        <div class="chip">Just haven't gotten to it</div>
      </div>
    </div>
  `},

  // 6: Done
  { id: 'done', label: 'Done', render: () => `
    <div class="done">
      <div class="check">&#10003;</div>
      <h2>That's it. Thanks Jan.</h2>
      <p>We've got what we need to start writing in your voice. Your content engineer will go through everything and might reach out for a quick follow up if anything needs clarifying. First drafts coming soon.</p>
    </div>
  `}
];

let current = 0;
const answers = {};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section active">${sections[current].render()}</div>`;

  app.querySelectorAll('[data-key]').forEach(el => {
    const k = el.dataset.key;
    if (answers[k] !== undefined) {
      if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
        el.value = answers[k];
      } else if (el.classList.contains('chips')) {
        const selected = Array.isArray(answers[k]) ? answers[k] : [answers[k]];
        el.querySelectorAll('.chip').forEach(c => {
          if (selected.includes(c.textContent)) c.classList.add('selected');
        });
      }
    }
  });

  app.querySelectorAll('.chips').forEach(container => {
    const multi = container.dataset.multi === 'true';
    const revealLabel = container.dataset.reveal;
    container.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        if (!multi) container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.toggle('selected');
        if (revealLabel) toggleReveal(container, revealLabel);
        saveAll();
      });
    });
    if (revealLabel) toggleReveal(container, revealLabel);
  });

  app.querySelectorAll('textarea, input').forEach(el => {
    el.addEventListener('input', () => saveAll());
  });

  updateUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleReveal(container, label) {
  const selected = [...container.querySelectorAll('.chip.selected')].map(c => c.textContent);
  const reveal = container.parentElement.querySelector(`[data-reveal-for="${label}"]`);
  if (!reveal) return;
  if (selected.includes(label)) reveal.classList.add('show');
  else reveal.classList.remove('show');
}

function saveAll() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-key]').forEach(el => {
    const k = el.dataset.key;
    if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
      answers[k] = el.value;
    } else if (el.classList.contains('chips')) {
      const sel = [...el.querySelectorAll('.chip.selected')].map(c => c.textContent);
      answers[k] = el.dataset.multi === 'true' ? sel : (sel[0] || '');
    }
  });
}

function updateUI() {
  const total = sections.length - 1;
  const pct = current === 0 ? 0 : current >= total ? 100 : Math.round((current / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('sectionLabel').textContent = sections[current].label;

  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');

  back.style.visibility = current === 0 ? 'hidden' : 'visible';

  if (current === 0) {
    next.textContent = 'Get Started';
    next.className = 'btn btn-primary';
  } else if (current === sections.length - 2) {
    next.textContent = 'Submit';
    next.className = 'btn btn-submit';
  } else if (current === sections.length - 1) {
    next.style.display = 'none';
    back.style.display = 'none';
    document.querySelector('.nav-bar').style.display = 'none';
  } else {
    next.textContent = 'Continue';
    next.className = 'btn btn-primary';
  }
}

let submitted = false;

function submitAnswers() {
  if (submitted) return;
  submitted = true;

  const url = 'https://script.google.com/macros/s/AKfycbwiECOki0F876OSTvb9KiF3_b65qIApkzpXwBhpZ_IT_BUaFITeYqu83v89E0NYV5-C/exec';
  const body = JSON.stringify(answers);

  // sendBeacon is purpose-built for fire-and-forget form submissions.
  // It avoids the no-cors + Content-Type weirdness that breaks fetch in some browsers.
  const blob = new Blob([body], { type: 'text/plain' });
  const sent = navigator.sendBeacon && navigator.sendBeacon(url, blob);

  // Fallback for browsers where sendBeacon isn't available or refuses the payload.
  if (!sent) {
    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });
  }
}

function goNext() {
  saveAll();
  if (current < sections.length - 1) {
    current++;
    render();
  }
  if (current === sections.length - 1) {
    submitAnswers();
  }
}

function goBack() {
  saveAll();
  if (current > 0) { current--; render(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.metaKey) goNext();
});

render();
</script>
</body>
</html>
